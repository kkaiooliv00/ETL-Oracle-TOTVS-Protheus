# Mapeamento de tabelas Oracle TOTVS Protheus -> PostgreSQL.
#
# oracle_schema: schema/owner no Oracle onde ficam as tabelas TOTVS.
# jobs[].oracle_table: nome fisico da tabela no Oracle (com sufixo 010).
# jobs[].target_table: nome da tabela destino no PostgreSQL (schema totvs).
# jobs[].query: (opcional) query SQL customizada. Se informada, substitui o
#               SELECT * automatico. Use {schema} como placeholder para o schema.
#               Exemplo: "SELECT C1_NUM, C1_EMISSAO FROM {schema}.SC1010 WHERE C1_TIPO = '1'"
#               Se nao informada, gera automaticamente:
#               SELECT * FROM {schema}.{oracle_table} WHERE D_E_L_E_T_ <> '*'
# jobs[].date_column: coluna de data para filtro incremental (YYYYMMDD).
#                     Se ausente, a carga e sempre total (sem filtro de data).
#                     So funciona com query automatica (sem campo query).
# jobs[].business_key: coluna de chave unica para upsert (padrao: super_chave).
# jobs[].business_key_columns: colunas para gerar chave composta (opcional).

oracle_schema: U_CJ4AP2_PR

jobs:
  - oracle_table: SC1010
    target_table: SC1
    date_column: C1_EMISSAO
    query: >
      SELECT COALESCE(TRIM(SC1.C1_FILIAL),' ') || '|' || COALESCE(TRIM(SC1.C1_NUM),' ') || '|' || COALESCE(TRIM(SC1.C1_ITEM),' ') || '|' || COALESCE(TRIM(SC1.C1_PRODUTO),' ') || '|' || COALESCE(TO_CHAR(SC1.R_E_C_N_O_),' ') AS SUPER_CHAVE,SC1.C1_FILIAL,SC1.C1_NUM,CASE WHEN SC1.C1_RESIDUO = 'S' AND SC1.C1_COMPRAC = '1' THEN 'COMPRA CENTRALIZADA' WHEN SC1.C1_RESIDUO = 'S' THEN 'ELIMINAÇÃO DE RESÍDUO / ENCERRADA' WHEN SC1.C1_QUJE = 0 AND (SC1.C1_COTACAO IS NULL OR SC1.C1_COTACAO = ' ' OR SC1.C1_COTACAO = 'IMPORT') AND SC1.C1_APROV = 'R' THEN 'REJEITADA POR ALÇADA' WHEN SC1.C1_QUJE = 0 AND (SC1.C1_COTACAO IS NULL OR SC1.C1_COTACAO = ' ' OR SC1.C1_COTACAO = 'IMPORT') AND SC1.C1_APROV = 'B' THEN 'AGUARDANDO LIBERAÇÃO (ALÇADA)' WHEN SC1.C1_QUJE = 0 AND SC1.C1_APROV = 'L' AND (SC1.C1_COTACAO IS NULL OR SC1.C1_COTACAO = ' ' OR SC1.C1_COTACAO = 'ANALIS') AND SC1.C1_TPSC = '2' THEN 'SOLICITAÇÃO PARA LICITAÇÃO' WHEN SC1.C1_TPSC = '2' AND SC1.C1_QUJE = 0 AND (SC1.C1_CODED IS NOT NULL AND SC1.C1_CODED <> ' ') THEN 'GESTÃO DE LICITAÇÃO' WHEN SC1.C1_QUANT = SC1.C1_QUJE THEN 'TOTALMENTE ATENDIDA' WHEN SC1.C1_FLAGGCT = '1' AND SC1.C1_QUJE < SC1.C1_QUANT THEN 'INTEGRAÇÃO GCT' WHEN SC1.C1_QUJE > 0 AND SC1.C1_QUJE < SC1.C1_QUANT THEN 'PARCIALMENTE ATENDIDA' WHEN SC1.C1_QUJE = 0 AND (SC1.C1_COTACAO IS NULL OR SC1.C1_COTACAO = ' ') AND SC1.C1_APROV = 'L' THEN 'DISPONÍVEL PARA PEDIDO' WHEN SC1.C1_COTACAO IS NOT NULL AND SC1.C1_COTACAO <> ' ' THEN 'EM PROCESSO DE COTAÇÃO' WHEN SC1.C1_IMPORT = 'S' THEN 'SOLICITAÇÃO IMPORTADO' ELSE 'LEGENDA NÃO IDENTIFICADA' END AS LEGENDA_SC,SC1.C1_ITEM,SC1.C1_EMISSAO,SC1.C1_PRODUTO,SC1.C1_CC,SC1.C1_UM,SC1.C1_DESCRI,SC1.C1_QUANT,SC1.C1_PRECO,SC1.C1_TOTAL,SC1.C1_PEDIDO,SC1.C1_ITEMPED,SC1.C1_SOLICIT,SC1.C1_VUNIT,SC1.C1_APROV,SC1.C1_NOMAPRO,SC1.C1_UNIDREQ,SC1.C1_LOCAL,SC1.R_E_C_N_O_ FROM {schema}.SC1010 SC1 WHERE SC1.D_E_L_E_T_ = ' '

  - oracle_table: SC8010
    target_table: SC8
    query: >
      SELECT COALESCE(TRIM(C8_FILIAL),' ') || '|' || COALESCE(TRIM(C8_NUM),' ') || '|' || COALESCE(TRIM(C8_ITEM),' ') || '|' || COALESCE(TRIM(C8_NUMSC),' ') || '|' || COALESCE(TRIM(C8_ITEMSC),' ') || '|' || COALESCE(TRIM(C8_FORNECE),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,C8_FILIAL,C8_EMISSAO,C8_NUM,C8_NUMSC,C8_ITEMSC,C8_ITEM,C8_NUMPED,C8_FORNECE,C8_PRECO,C8_TOTAL,C8_COND,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SC8010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SC7010
    target_table: SC7
    date_column: C7_EMISSAO
    query: >
      SELECT COALESCE(TRIM(SC7.C7_FILIAL),' ') || '|' || COALESCE(TRIM(SC7.C7_NUM),' ') || '|' || COALESCE(TRIM(SC7.C7_ITEM),' ') || '|' || COALESCE(TRIM(SC7.C7_FORNECE),' ') || '|' || COALESCE(TO_CHAR(SC7.R_E_C_N_O_),' ') AS SUPER_CHAVE,SC7.C7_FILIAL,SC7.C7_NUM,CASE WHEN SC7.C7_RESIDUO = 'S' THEN 'ELIMINADO POR RESIDUO CINZA CLARO' WHEN SC7.C7_APROV = 'R' THEN 'REJEITADO PELO APROVADOR X' WHEN SC7.C7_APROV = 'B' THEN 'EM APROVACAO AZUL' WHEN SC7.C7_CONTRA IS NOT NULL AND SC7.C7_CONTRA <> ' ' THEN 'PEDIDO CONTRATO CGT BRANCO' WHEN SC7.C7_PENDEN = 'N' THEN 'RECEBIDO VERMELHO' WHEN SC7.C7_PENDEN = 'S' AND COALESCE(SUM(D1.D1_QUANT),0) > 0 THEN 'EM RECEBIMENTO PRE NOTA LARANJA' WHEN SC7.C7_PENDEN = 'S' THEN 'PENDENTE VERDE' ELSE 'OUTROS' END AS LEGENDA_PC,SC7.C7_ITEM,SC7.C7_NUMSC,SC7.C7_ITEMSC,SC7.C7_CC,SC7.C7_FORNECE,SC7.C7_PRODUTO,SC7.C7_COND,SC7.C7_EMISSAO,SC7.C7_QUANT,SC7.C7_PRECO,SC7.C7_TOTAL,SC7.C7_MEDICAO,SC7.C7_PENDEN,SC7.C7_FLUXO,SC7.C7_APROV,SC7.C7_DATPRF,SC7.C7_XNOMCOM,SC7.C7_USER,SC7.C7_ENCER,SC7.C7_NUMSA,SC7.C7_LOJA,SC7.C7_NUMCOT,SC7.C7_XNATURE,SC7.C7_XCODNAT,SC7.C7_DESCRI,SC7.C7_CONTRA,SC7.C7_LOCAL,SC7.C7_OBS,SC7.R_E_C_N_O_,SC7.D_E_L_E_T_ FROM {schema}.SC7010 SC7 LEFT JOIN {schema}.SD1010 D1 ON D1.D1_FILIAL = SC7.C7_FILIAL AND D1.D1_PEDIDO = SC7.C7_NUM AND D1.D1_ITEMPC = SC7.C7_ITEM AND D1.D_E_L_E_T_ = ' ' WHERE  SC7.D_E_L_E_T_ = ' ' GROUP BY SC7.C7_FILIAL, SC7.C7_NUM, SC7.C7_RESIDUO, SC7.C7_APROV, SC7.C7_CONTRA, SC7.C7_PENDEN, SC7.C7_ITEM, SC7.C7_NUMSC, SC7.C7_ITEMSC, SC7.C7_CC, SC7.C7_FORNECE,SC7.C7_PRODUTO, SC7.C7_COND, SC7.C7_EMISSAO, SC7.C7_QUANT, SC7.C7_PRECO, SC7.C7_TOTAL, SC7.C7_MEDICAO, SC7.C7_FLUXO, SC7.C7_DATPRF, SC7.C7_XNOMCOM, SC7.C7_USER, SC7.C7_ENCER, SC7.C7_NUMSA, SC7.C7_LOJA, SC7.C7_NUMCOT, SC7.C7_XNATURE, SC7.C7_XCODNAT, SC7.C7_DESCRI, SC7.C7_LOCAL, SC7.C7_OBS, SC7.R_E_C_N_O_, SC7.D_E_L_E_T_  ORDER BY  SUPER_CHAVE

  - oracle_table: SD1010
    target_table: SD1
    query: >
      SELECT COALESCE(TRIM(SD.D1_FILIAL),' ') || '|' || COALESCE(TRIM(SD.D1_DOC),' ') || '|' || COALESCE(TRIM(SD.D1_FORNECE),' ') || '|' || COALESCE(TRIM(SD.D1_PEDIDO),' ') || '|' || COALESCE(TRIM(SD.D1_ITEMPC),' ') || '|' || COALESCE(TO_CHAR(SD.R_E_C_N_O_),' ') AS SUPER_CHAVE,SD.D1_FILIAL,SD.D1_PEDIDO,D1_QUANT,SD.D1_ITEMPC,SD.D1_SERIE,SD.D1_XDESC,SD.D1_CC,D1_DTDIGIT,SD.D1_DOC,SD.D1_FORNECE,D1_LOCAL,SD.D1_TES,SD.D1_TOTAL,SD.R_E_C_N_O_,SD.D_E_L_E_T_,SF.F1_EMISSAO FROM {schema}.SD1010 SD LEFT JOIN {schema}.SF1010 SF ON SF.F1_FILIAL = SD.D1_FILIAL AND SF.F1_DOC = SD.D1_DOC AND SF.F1_FORNECE = SD.D1_FORNECE AND SF.D_E_L_E_T_ = ' ' WHERE  SD.D_E_L_E_T_ = ' '

  - oracle_table: SF1010
    target_table: SF1
    date_column: F1_EMISSAO
    query: >
      SELECT COALESCE(TRIM(F1_FILIAL),' ') || '|' || COALESCE(TRIM(F1_DOC),' ') || '|' || COALESCE(TRIM(F1_FORNECE),' ') || '|' || COALESCE(TRIM(F1_EMISSAO),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,F1_FILIAL,F1_DOC,F1_FORNECE,F1_DUPL,F1_COND,F1_EMISSAO,F1_STATUS,F1_SERIE,F1_LOJA,F1_RECBMTO,F1_DTDIGIT,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SF1010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SA2010
    target_table: SA2
    query: >
      SELECT COALESCE(TRIM(A2_COD),' ') || '|' || COALESCE(TRIM(A2_LOJA),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,A2_COD,A2_LOJA,A2_NOME,A2_CGC,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SA2010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SE4010
    target_table: SE4
    query: >
      SELECT COALESCE(TRIM(E4_CODIGO),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,E4_CODIGO,E4_DESCRI,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SE4010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SYS_COMPANY
    target_table: SYS_COMPANY_FILIAIS
    query: >
      SELECT COALESCE(TRIM(M0_CODFIL),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,M0_CODFIL,M0_FILIAL,M0_CGC,R_E_C_N_O_ FROM {schema}.SYS_COMPANY

  - oracle_table: SBM010
    target_table: SBM
    query: >
      SELECT COALESCE(TRIM(BM_GRUPO),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,BM_GRUPO,BM_DESC,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SBM010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SCR010
    target_table: SCR
    query: >
      SELECT COALESCE(TRIM(CR_FILIAL),' ') || '|' || COALESCE(TRIM(CR_NUM),' ') || '|' || COALESCE(TRIM(CR_TIPO),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,CR_FILIAL,CR_STATUS,CR_NUM,CR_APROV,CR_TIPO,CR_DATALIB,CASE WHEN CR_STATUS = '01' THEN 'Aguardando nivel anterior' WHEN CR_STATUS = '02' THEN 'Pendente' WHEN CR_STATUS = '03' THEN 'Liberado' WHEN CR_STATUS = '04' THEN 'Bloqueado' WHEN CR_STATUS = '05' THEN 'Liberado outro aprov.' WHEN CR_STATUS = '06' THEN 'Rejeitado' WHEN CR_STATUS = '07' THEN 'Rej/Bloq outro aprov.' ELSE 'Status Desconhecido' END AS CR_STATUS_LEGENDA,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SCR010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: DBM010
    target_table: DBM
    query: >
      SELECT COALESCE(TRIM(DBM_FILIAL),' ') || '|' || COALESCE(TRIM(DBM_TIPO),' ') || '|' || COALESCE(TRIM(DBM_NUM),' ') || '|' || COALESCE(TRIM(DBM_ITEM),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,DBM_FILIAL,DBM_TIPO,DBM_NUM,DBM_ITEM,DBM_APROV,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.DBM010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: CTT010
    target_table: CTT
    query: >
      SELECT TRIM(CTT_FILIAL) || '_' || TRIM(CTT_CUSTO) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,CTT_FILIAL,CTT_CUSTO,CTT_DESC01,CTT_CLASSE,CTT_NORMAL,CTT_BLOQ,CTT_DTBLIN,CTT_DTBLFI,CTT_DTEXIS,CTT_DTEXSF,CTT_TIPO00,CTT_CCSUP,CTT_TPLOT,CTT_STATUS,CTT_NOME,CTT_LOCAL FROM {schema}.CTT010 CTT WHERE CTT.D_E_L_E_T_ = ' '

  - oracle_table: SYS_USR
    target_table: SYS_USR
    business_key: usr_id
    query: >
      SELECT TRIM(USR_ID) || '|' || TRIM(USR_NOME) || '|' || TRIM(USR_EMAIL) || '|' || TRIM(USR_DEPTO) || '|' || TRIM(USR_CARGO) AS SUPER_CHAVE, USR_ID, USR_NOME, USR_EMAIL, USR_DEPTO, USR_CARGO FROM {schema}.SYS_USR

  - oracle_table: SED010
    target_table: SED
    query: >
      SELECT COALESCE(TRIM(SED.ED_FILIAL),' ') || '|' || COALESCE(TRIM(SED.ED_CODIGO),' ') AS SUPER_CHAVE,ED_FILIAL,ED_CODIGO,ED_DESCRIC FROM {schema}.SED010 SED WHERE SED.D_E_L_E_T_ = ' '

  - oracle_table: SB2010
    target_table: SB2
    query: >
      SELECT TRIM(B2_FILIAL) || '_' || TRIM(B2_COD) || '_' || TRIM(B2_LOCAL) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,B2_FILIAL,B2_COD,B2_QFIM,B2_LOCAL,B2_QATU,B2_VFIM1,B2_CM1,B2_USAI,B2_LOCALIZ,B2_RESERVA,B2_QEMPSA,B2_SALPPRE,B2_QFIMFF,B2_STATUS,B2_LOCAL,B2_TIPO,B2_BLOQUEI,B2_DMOV,B2_HMOV,B2_VATU1 FROM {schema}.SB2010 SB2 WHERE SB2.D_E_L_E_T_ = ' '

  - oracle_table: SB1010
    target_table: SB1
    business_key: r_e_c_n_o_
    query: >
      SELECT COALESCE(TRIM(B1_COD),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,B1_FILIAL,B1_COD,B1_DESC,B1_GRUPO,B1_UM,B1_ESTSEG,B1_UPRC,B1_CONTA,B1_UREV,B1_DATREF,B1_ATIVO,B1_XCTACOM,B1_XCTABAI,B1_LOCPAD,R_E_C_N_O_ FROM {schema}.SB1010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SCQ010
    target_table: SCQ
    query: >
      SELECT COALESCE(TRIM(CQ_FILIAL),' ') || '|' || COALESCE(TRIM(CQ_NUM),' ') || '|' || COALESCE(TRIM(CQ_PRODUTO),' ') || '|' || COALESCE(TRIM(CQ_NUMREQ),' ') || '|' || COALESCE(TO_CHAR(R_E_C_N_O_),' ') AS SUPER_CHAVE,CQ_FILIAL,CQ_NUM,CQ_NUMSC,CQ_PRODUTO,CQ_UM,CQ_QUANT,CQ_SEGUM,CQ_QTSEGUM,CQ_OBS,CQ_CONTA,CQ_DESCRI,CQ_NUMSC,CQ_ITSC,CQ_OK,CQ_NUMREQ,CQ_ITEM,CQ_OP,CQ_CC,CQ_DATPRF,CQ_QTDISP,CQ_STATUSC,CQ_ITEMCTA,CQ_LOCAL,R_E_C_N_O_,D_E_L_E_T_ FROM {schema}.SCQ010 WHERE D_E_L_E_T_ = ' '

  - oracle_table: SCP010
    target_table: SCP
    date_column: CP_EMISSAO
    query: >
      SELECT TRIM(CP_FILIAL) || '_' || TRIM(CP_NUM) || '_' || TRIM(CP_ITEM) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,CP_FILIAL,CP_NUM,CP_ITEM,CP_PRODUTO,CP_UM,CP_DESCRI,CP_QUANT,CASE WHEN (SCP.CP_STATUS IS NOT NULL AND SCP.CP_STATUS <> ' ') AND SCP.CP_PREREQU = 'S' AND SCP.CP_QUANT = SCP.CP_QUJE THEN 'PRÉ-REQUISIÇÃO BAIXADA/VERMELHO' WHEN (SCP.CP_STATUS IS NULL OR SCP.CP_STATUS = ' ') AND SCP.CP_PREREQU = 'S' AND SCP.CP_QUJE = 0 THEN 'BAIXAR PRÉ-REQUISIÇÃO/VERDE' WHEN (SCP.CP_STATUS IS NULL OR SCP.CP_STATUS = ' ') AND (SCP.CP_PREREQU IS NULL OR SCP.CP_PREREQU = ' ') THEN 'GERAR PRÉ-REQUISIÇÃO/AMARELO' WHEN (SCP.CP_STATUS IS NOT NULL AND SCP.CP_STATUS <> ' ') AND SCP.CP_PREREQU = 'S' AND SCP.CP_QUANT > SCP.CP_QUJE THEN 'PRÉ-REQUISIÇÃO ENCERRADA/AZUL' WHEN (SCP.CP_STATUS IS NULL OR SCP.CP_STATUS = ' ') AND SCP.CP_PREREQU = 'S' AND SCP.CP_QUJE > 0 THEN 'PARCIALMENTE BAIXADA/LARANJA' ELSE 'STATUS NÃO MAPEADO' END AS LEGENDA_STATUS,CP_DATPRF,CP_OBS,CP_OP,CP_CC,CP_CONTA,CP_EMISSAO,CP_CODSOLI,CP_SOLICIT,CP_QUJE,CP_OK,CP_PREREQU,CP_STATUS,CP_NUMOS,CP_USER,CP_NUMSC,CP_LOCAL,CP_RATEIO FROM {schema}.SCP010 SCP WHERE SCP.D_E_L_E_T_ = ' '

  - oracle_table: SF5010
    target_table: SF5
    query: >
      SELECT TRIM(F5_FILIAL) || '_' || TRIM(F5_CODIGO) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,F5_CODIGO,F5_TEXTO,F5_TIPO FROM {schema}.SF5010 SF5 WHERE SF5.D_E_L_E_T_ = ' '

  - oracle_table: SF4010
    target_table: SF4
    query: >
      SELECT TRIM(F4_FILIAL) || '_' || TRIM(F4_CODIGO) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,F4_CODIGO,F4_TIPO,F4_FILIAL,F4_TIPO,F4_ICM,F4_IPI,F4_ESTOQUE,F4_CF,F4_TEXTO,F4_FINALID FROM {schema}.SF4010 SF4 WHERE SF4.D_E_L_E_T_ = ' '

  - oracle_table: STL010
    target_table: STL
    query: >
      SELECT TRIM(TL_FILIAL) || '_' || TRIM(TL_ORDEM) || '_' || TRIM(TL_NUMSC) || '_' || TRIM(TL_ITEMSC) || '_' || TO_CHAR(R_E_C_N_O_) AS SUPER_CHAVE,TL_FILIAL,TL_ORDEM,TL_SEQRELA,TL_TAREFA,TL_TIPOREG,TL_CODIGO,TL_QUANTID,TL_UNIDADE,TL_CUSTO,TL_DESTINO,TL_DTINICI,TL_HOINICI,TL_DTFIM,TL_HOFIM,TL_REPFIM,TL_NUMSEQ,TL_NOTFIS,TL_NUMSA,TL_ITEMSA,TL_SEQTARE,TL_DOC,TL_ORIGNFE,TL_LOCAL,TL_PLANO,TL_NUMSC FROM {schema}.STL010 STL WHERE STL.D_E_L_E_T_ = ' '

  - oracle_table: SE2010
    target_table: SE2
    date_column: E2_EMISSAO
    query: >
      SELECT
          COALESCE(TRIM(SE2.E2_FILIAL), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_PREFIXO), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_NUM), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_PARCELA), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_TIPO), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_FORNECE), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_LOJA), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_NATUREZ), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_CCUSTO), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_EMISSAO), ' ') || '|' ||
          COALESCE(TRIM(SE2.E2_VENCTO), ' ') AS SUPER_CHAVE,
          SE2.E2_FILIAL,
          SE2.E2_CCUSTO,
          SE2.E2_PREFIXO,
          SE2.E2_NUM,
          SE2.E2_PARCELA,
          SE2.E2_TIPO,
          SE2.E2_NATUREZ,
          SE2.E2_NOMFOR,
          SE2.E2_EMISSAO,
          SE2.E2_VENCTO,
          SE2.E2_HIST,
          SE2.E2_VENCREA,
          SE2.E2_VALOR,
          SE2.E2_ISS,
          SE2.E2_IRRF,
          SE2.E2_EMIS1,
          SE2.E2_SALDO,
          SE2.E2_VALLIQ,
          SE2.E2_RATEIO,
          SE2.E2_ORIGEM,
          SE2.E2_TEMDOCS,
          SE2.E2_FORNECE,
          SE2.E2_LOJA,
          SE2.E2_CONTAD,
          SE2.E2_BAIXA,
          SE2.E2_USUALIB,
          SE2.E2_USERLGI,
          REGEXP_REPLACE(
              TRIM(
                  SUBSTR(SE2.E2_USERLGI, 3, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 7, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 11, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 15, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 2, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 6, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 10, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 14, 1)
              ),
              '[^0-9]',
              ''
          ) AS CODIGO_USUARIO,
          USR.USR_NOME
      FROM {schema}.SE2010 SE2
      LEFT JOIN {schema}.SYS_USR USR ON
          USR.USR_ID = REGEXP_REPLACE(
              TRIM(
                  SUBSTR(SE2.E2_USERLGI, 3, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 7, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 11, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 15, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 2, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 6, 1)  ||
                  SUBSTR(SE2.E2_USERLGI, 10, 1) ||
                  SUBSTR(SE2.E2_USERLGI, 14, 1)
              ),
              '[^0-9]',
              ''
          )
      WHERE SE2.D_E_L_E_T_ = ' '
        AND SE2.E2_NATUREZ NOT IN ('2010101', '8888888', '9999999')
        AND SE2.E2_EMISSAO >= '20250501'

