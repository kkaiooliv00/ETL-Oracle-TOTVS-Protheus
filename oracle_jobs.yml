  - oracle_table: CN9010
    target_table: CN9
    date_column: CN9_DTINIC
    query: >
      SELECT COALESCE(TRIM(CN9.CN9_NUMERO),' ') || '_' || COALESCE(TRIM(CN9.CN9_FILIAL),' ') || '_' || COALESCE(TRIM(CN9.CN9_CLIENT),' ') AS SUPER_CHAVE, CN9.CN9_FILIAL AS FILIAL, SC.M0_FILIAL AS "NOME FILIAL", CN9.CN9_NUMERO AS NUMERO_CONTRATO, CN9.CN9_DESCRI AS "DESCRICAO TIPO CONTRATO", CN9.CN9_REVISA AS REVISAO, CN9.CN9_CLIENT AS "CLIENTE", CN9.CN9_SITUAC AS STATUS_COD, CASE WHEN CN9.CN9_SITUAC = '01' THEN 'Cancelado' WHEN CN9.CN9_SITUAC = '02' THEN 'Elaborado' WHEN CN9.CN9_SITUAC = '03' THEN 'Emitido' WHEN CN9.CN9_SITUAC = '04' THEN 'Aprovado' WHEN CN9.CN9_SITUAC = '05' THEN 'Vigente' WHEN CN9.CN9_SITUAC = '06' THEN 'Paralisado' WHEN CN9.CN9_SITUAC = '07' THEN 'Sol. Finalizacao' WHEN CN9.CN9_SITUAC = '08' THEN 'Finalizado' WHEN CN9.CN9_SITUAC = '09' THEN 'Revisao' WHEN CN9.CN9_SITUAC = '10' THEN 'Revisão com aprovação por alçadas' ELSE 'Outros' END AS SITUACAO_CONTRATO, TO_CHAR(TO_DATE(CN9.CN9_DTINIC, 'YYYYMMDD'), 'DD/MM/YYYY') AS DATA_INICIO, TO_CHAR(TO_DATE(CN9.CN9_DTFIM, 'YYYYMMDD'), 'DD/MM/YYYY') AS DATA_FIM, TRUNC(TO_DATE(CN9.CN9_DTFIM, 'YYYYMMDD')) - TRUNC(SYSDATE) AS DIAS_PARA_VENCER, CASE WHEN TRUNC(TO_DATE(CN9.CN9_DTFIM, 'YYYYMMDD')) - TRUNC(SYSDATE) < 0 THEN 'Já Vencido' WHEN TRUNC(TO_DATE(CN9.CN9_DTFIM, 'YYYYMMDD')) - TRUNC(SYSDATE) <= 30 THEN 'Vence em até 30 dias' WHEN TRUNC(TO_DATE(CN9.CN9_DTFIM, 'YYYYMMDD')) - TRUNC(SYSDATE) <= 90 THEN 'Vence em até 90 dias' ELSE 'Vence acima de 90 dias' END AS CLASSIFICACAO_VENCIMENTO, CN9.CN9_VLINI AS VALOR_INICIAL, CN9.CN9_VLATU AS VALOR_ATUAL, CN9.CN9_SALDO AS SALDO_DISPONIVEL, CN9.CN9_CONDPG AS CONDICAO_PAGAMENTO FROM {schema}.CN9010 CN9 LEFT JOIN {schema}.SYS_COMPANY SC ON SC.M0_CODFIL = CN9.CN9_FILIAL WHERE CN9.D_E_L_E_T_ = ' ' ORDER BY CN9.CN9_FILIAL, DIAS_PARA_VENCER ASC

