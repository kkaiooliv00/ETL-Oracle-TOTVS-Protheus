  - oracle_table: ZZ1010
    target_table: zz1e2
    date_column: ZZ1_DATA
    query: >
      SELECT
          TRIM(Z1.ZZ1_FILCTE) || '_' ||
          TRIM(Z1.ZZ1_NUMCTE) || '_' ||
          TRIM(Z1.ZZ1_SERCTE) || '_' ||
          TRIM(Z1.ZZ1_CLIENT) || '_' ||
          TRIM(Z1.ZZ1_CODIGO) || '_' ||
          TRIM(Z1.ZZ1_DATA) || '_' ||
          TRIM(Z1.ZZ1_HORA) AS SUPER_CHAVE,
          Z1.ZZ1_FILCTE,
          Z1.ZZ1_NUMCTE,
          Z1.ZZ1_ACAO,
          case z1.ZZ1_ACAO
            when 'S' then 'Substituido'
            when 'C' then 'Complementar'
            when 'I' then 'Inclusão'
            when 'E' then 'Exclusao/Cancelamento'
              when 'B' then 'Baixa de contrato de frete'
                else ''
            end as zz1_acao_legenda,
          Z1.ZZ1_CODIGO,
          Z1.ZZ1_CODPRO,
          Z1.ZZ1_DATA,
          Z1.ZZ1_HORA,
          CASE
              WHEN Z1.ZZ1_STATUS = 'P' THEN 'Integrado com sucesso'
              WHEN Z1.ZZ1_STATUS = 'E' THEN 'Erro na integração'
              ELSE Z1.ZZ1_STATUS
          END AS STATUS_INTEGRACAO,
          Z1.ZZ1_STATUS,
          Z1.ZZ1_CHAVE,
          Z1.ZZ1_TIPO,
          case z1.zz1_tipo
          when '1' then 'CTE'
          when '2' then 'NFs'
          when '3' then 'combustivel'
          when '4' then 'Contrato Frete'
          else ''
            end   as tipo_cte_texto,
          Z1.ZZ1_SERCTE,
          Z1.ZZ1_CLIENT,
          CASE
              WHEN Z1.ZZ1_STATUS = 'E' THEN Z2.LOG
              when z1.ZZ1_STATUS = 'P' THEN 'Integrado com sucesso'
          END AS LOG_INTEGRACAO
      FROM {schema}.ZZ1010 Z1
      LEFT JOIN (
          SELECT
              ZZ2_CODZZ1,
              LOG,
              ZZ2_DTPROS
          FROM (
              SELECT
                  ZZ2.ZZ2_CODZZ1,
                  REPLACE(
                      REPLACE(
                          COALESCE(TO_CHAR(ZZ2.ZZ2_LOG), ' '),
                          CHR(10),
                          ' '
                      ),
                      CHR(13),
                      ' '
                  ) AS LOG,
                  ZZ2.ZZ2_DTPROS,
                  ROW_NUMBER() OVER (
                      PARTITION BY ZZ2.ZZ2_CODZZ1
                      ORDER BY
                          ZZ2.ZZ2_DTPROS DESC,
                          ZZ2.ZZ2_CODIGO DESC
                  ) AS RN
              FROM {schema}.ZZ2010 ZZ2
              WHERE ZZ2.D_E_L_E_T_ = ' '
                AND ZZ2.ZZ2_DTPROS >= '20260501'
          )
          WHERE RN = 1
      ) Z2
          ON Z2.ZZ2_CODZZ1 = Z1.ZZ1_CODIGO
      WHERE Z1.D_E_L_E_T_ = ' '
        AND Z1.ZZ1_DATA >= '20260501'

