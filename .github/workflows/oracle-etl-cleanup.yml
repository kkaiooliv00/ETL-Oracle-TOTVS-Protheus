name: ETL Oracle Cleanup (Garbage Collection)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-oracle-cleanup
  cancel-in-progress: false

jobs:
  run-etl-cleanup:
    name: ETL Oracle Cleanup
    runs-on: self-hosted
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar Python instalado
        run: |
          python --version
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Error "Python não encontrado na máquina"
            exit 1
          }
        shell: pwsh

      - name: Verificar dependências instaladas
        run: |
          $modules = @("oracledb", "pandas", "openpyxl", "psycopg", "dotenv", "yaml", "sqlalchemy")
          $missing = @()
          foreach ($m in $modules) {
            python -c "import $m" 2>$null
            if ($LASTEXITCODE -ne 0) {
              $missing += $m
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Módulos faltando: $($missing -join ', ')"
            exit 1
          } else {
            Write-Host "Todas as dependências já estão instaladas."
          }
        shell: pwsh

      - name: Executar ETL Cleanup
        shell: powershell
        env:
          ETL_JOBS_FILE: oracle_jobs_cleanup.yml
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORA_HOST: ${{ secrets.ORA_HOST }}
          ORA_PORT: ${{ secrets.ORA_PORT }}
          ORA_SERVICE: ${{ secrets.ORA_SERVICE }}
          ORA_USER: ${{ secrets.ORA_USER }}
          ORA_PASSWORD: ${{ secrets.ORA_PASSWORD }}
        run: |
          Write-Output "Iniciando Limpeza de Registros Deletados (Garbage Collection)"
          python oracle_etl.py --delete-mode
